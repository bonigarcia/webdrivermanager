name: Dependabot auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable_auto_merge:
    runs-on: ubuntu-latest
    if: >
      github.event.action != 'closed' &&
      github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        run: |
          max_retries=10
          retry_count=0
          sleep_duration=1
          while ! gh pr merge "$PR_URL" --auto --squash; do
              retry_count=$((retry_count+1))
              if [ $retry_count -ge $max_retries ]; then
                  echo "Command failed after $retry_count attempts."
                  exit 1
              fi
              echo "Command failed. Retrying in $sleep_duration seconds..."
              sleep $sleep_duration
              sleep_duration=$((sleep_duration * 2))
          done
          echo "Command succeeded after $retry_count attempts."
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  cleanup:
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Delete Dependabot branch
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Deleting branch: $BRANCH"
          gh api "repos/${{ github.repository }}/git/refs/heads/$BRANCH" -X DELETE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}